<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#172922">
  <meta name="description" content="80 种平价即食美味，按类别和预算随机抽取，轻松决定今天吃什么。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./app-icon-192.png">
  <link rel="apple-touch-icon" href="./app-icon-192.png">
  <title>吃点啥｜今天吃什么</title>
  <style>
    :root {
      --paper: #f4efe4;
      --cream: #fffaf0;
      --ink: #172922;
      --red: #e64a2e;
      --yellow: #f0b94f;
      --line: #cfc6b5;
      --muted: #6c7269;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(230, 74, 46, .28);
      outline-offset: 3px;
    }
    .topbar {
      height: 78px;
      padding: 0 clamp(18px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 950; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--paper);
      background: var(--ink);
      transform: rotate(-8deg);
    }
    .date { text-align: center; line-height: 1.2; }
    .date small { display: block; color: var(--muted); font-size: 9px; font-weight: 900; letter-spacing: .16em; }
    .date strong { font-size: 13px; }
    .top-actions { justify-self: end; display: flex; align-items: center; gap: 9px; }
    .offline-badge, .menu-toggle, .install-button {
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      padding: 9px 13px;
      font-size: 11px;
      font-weight: 850;
    }
    .offline-badge { border-color: var(--line); color: var(--muted); }
    .offline-badge b { color: #348753; }
    .menu-toggle:hover, .install-button:hover { background: var(--ink); color: var(--cream); }
    .install-button { color: white; background: var(--red); }
    .install-button[hidden] { display: none; }
    .stage {
      min-height: calc(100vh - 78px);
      padding: 50px clamp(18px, 5vw, 72px) 68px;
      display: grid;
      grid-template-columns: minmax(210px, .75fr) minmax(480px, 1.45fr) minmax(170px, .5fr);
      align-items: center;
      gap: clamp(24px, 4vw, 60px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--yellow);
      font-size: 11px;
      font-weight: 900;
    }
    h1 {
      margin: 21px 0 18px;
      font-size: clamp(56px, 6vw, 98px);
      line-height: .9;
      letter-spacing: -.075em;
      font-weight: 950;
    }
    h1 em { color: var(--red); font-family: Georgia, "Songti SC", serif; font-weight: 500; }
    .intro > p { max-width: 280px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .count-note { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    .count-note > b { color: var(--red); font-family: Georgia, serif; font-size: 43px; }
    .count-note span { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .count-note strong { color: var(--ink); font-size: 13px; }
    .draw-panel {
      position: relative;
      z-index: 2;
      padding: clamp(19px, 3vw, 32px);
      background: var(--cream);
      border: 1.5px solid var(--ink);
      border-radius: 27px;
      box-shadow: 11px 11px 0 var(--ink);
    }
    .ticket-label { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 9px; font-weight: 900; letter-spacing: .15em; }
    .result {
      min-height: 188px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 23px;
      overflow: hidden;
      position: relative;
      padding: 24px clamp(18px, 3vw, 30px);
      border: 1.5px solid var(--ink);
      border-radius: 18px;
      background: var(--yellow);
    }
    .result::after { content: ""; width: 150px; height: 150px; position: absolute; right: -65px; top: -65px; border: 1px solid var(--ink); border-radius: 50%; opacity: .18; }
    .food-emoji {
      width: 102px;
      height: 102px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: #fff6da;
      box-shadow: 5px 5px 0 var(--ink);
      font-size: 58px;
    }
    .result-kicker { margin: 0 0 5px; font-size: 11px; font-weight: 900; letter-spacing: .1em; }
    .result h2 { margin: 0; font: 500 clamp(35px, 4vw, 56px)/1.05 Georgia, "Songti SC", serif; letter-spacing: -.05em; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
    .meta span { padding: 5px 9px; border: 1px solid var(--ink); border-radius: 999px; background: rgba(255,255,255,.28); font-size: 10px; font-weight: 850; }
    .meta .spicy { color: white; background: var(--red); }
    .result.rolling .food-emoji { animation: wobble .13s infinite alternate; filter: blur(1px); }
    .result.rolling h2 { animation: blink .13s infinite alternate; }
    .result.reveal { animation: reveal .42s cubic-bezier(.2,.9,.25,1.2); }
    @keyframes wobble { to { transform: rotate(7deg) scale(.96); } }
    @keyframes blink { to { opacity: .4; transform: translateY(2px); } }
    @keyframes reveal { from { transform: scale(.96); } to { transform: scale(1); } }
    .filters { margin-top: 20px; }
    .filter-row { display: grid; grid-template-columns: 75px 1fr; gap: 10px; padding: 13px 0; border-top: 1px dashed var(--line); }
    .filter-row.compact { grid-template-columns: 75px 1fr auto; align-items: center; }
    .filter-title { padding-top: 7px; font-size: 11px; font-weight: 900; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: #5d645e; background: transparent; font-size: 11px; }
    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip.active { border-color: var(--ink); color: var(--cream); background: var(--ink); font-weight: 800; }
    .pool-count { align-self: center; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .draw-button {
      width: 100%;
      height: 58px;
      margin-top: 8px;
      border: 1.5px solid var(--ink);
      border-radius: 14px;
      color: white;
      background: var(--red);
      box-shadow: 0 5px 0 var(--ink);
      font-size: 17px;
      font-weight: 950;
      letter-spacing: .05em;
    }
    .draw-button:hover { background: #d93f25; transform: translateY(1px); box-shadow: 0 4px 0 var(--ink); }
    .draw-button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    .hint { margin: 13px 0 -2px; text-align: center; color: #89877e; font-size: 10px; }
    .history-card { min-height: 205px; padding: 18px 0; display: flex; flex-direction: column; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .history-card h3 { margin: 0 0 15px; font-size: 11px; }
    .history-card .empty { color: #7d7f76; font: 15px/1.7 Georgia, "Songti SC", serif; }
    .history-card ol { list-style: none; padding: 0; margin: 0; }
    .history-card li { display: grid; grid-template-columns: 24px 1fr; gap: 7px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
    .history-card li span { color: var(--red); font-family: Georgia, serif; }
    .history-card small { margin-top: auto; padding-top: 17px; color: #8e8a80; font-size: 9px; letter-spacing: .16em; }
    .visual-strip { margin: 0; padding: 20px clamp(18px, 5vw, 72px) 75px; display: grid; grid-template-columns: minmax(0,1fr) minmax(220px,330px); }
    .visual-strip img { width: 100%; max-height: 370px; object-fit: cover; display: block; border: 1.5px solid var(--ink); border-radius: 21px 0 0 21px; }
    .visual-strip figcaption { padding: clamp(24px,4vw,48px); display: flex; flex-direction: column; justify-content: space-between; border: 1.5px solid var(--ink); border-left: 0; border-radius: 0 21px 21px 0; color: white; background: var(--red); }
    .visual-strip figcaption span { font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .visual-strip figcaption strong { font: 500 clamp(24px,2.5vw,36px)/1.25 Georgia, "Songti SC", serif; }
    .food-pool { display: none; padding: 80px clamp(18px, 6vw, 90px); color: var(--cream); background: var(--ink); }
    .food-pool.open { display: block; }
    .pool-heading { display: flex; align-items: end; justify-content: space-between; gap: 22px; margin-bottom: 34px; }
    .pool-heading small { color: var(--yellow); font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .pool-heading h2 { margin: 7px 0 0; font: 500 clamp(40px,5vw,66px)/1 Georgia, "Songti SC", serif; letter-spacing: -.04em; }
    .search { width: min(320px,100%); height: 46px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid #77827b; }
    .search input { width: 100%; border: 0; outline: 0; color: white; background: transparent; }
    .search input::placeholder { color: #a4aaa6; }
    .food-grid { display: grid; grid-template-columns: repeat(4,1fr); border-top: 1px solid #667169; border-left: 1px solid #667169; }
    .food-item { min-height: 80px; padding: 14px; display: grid; grid-template-columns: 24px auto 1fr auto; gap: 9px; align-items: center; border: 0; border-right: 1px solid #667169; border-bottom: 1px solid #667169; color: inherit; background: transparent; text-align: left; }
    .food-item:hover { color: var(--ink); background: var(--yellow); }
    .food-item .num { color: #859088; font: 10px Georgia, serif; }
    .food-item .emoji { font-size: 22px; }
    .food-item .name { font-size: 13px; font-weight: 850; }
    .food-item .price { color: #a9b0ab; font-size: 10px; }
    .food-item:hover .num, .food-item:hover .price { color: var(--ink); }
    .no-results { grid-column: 1 / -1; padding: 50px; text-align: center; color: #a9b0ab; }
    footer { height: 62px; padding: 0 clamp(18px, 5vw, 72px); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); font-size: 10px; font-weight: 800; letter-spacing: .06em; }
    @media (max-width: 1050px) {
      .stage { grid-template-columns: minmax(190px,.6fr) minmax(470px,1.4fr); }
      .history-card { display: none; }
      .food-grid { grid-template-columns: repeat(3,1fr); }
    }
    @media (max-width: 780px) {
      .topbar { grid-template-columns: 1fr auto; }
      .date, .offline-badge { display: none; }
      .stage { display: block; padding-top: 36px; min-height: auto; }
      .intro { margin-bottom: 30px; }
      h1 { font-size: clamp(58px,18vw,86px); }
      .draw-panel { box-shadow: 7px 7px 0 var(--ink); }
      .visual-strip { grid-template-columns: 1fr; padding-top: 0; }
      .visual-strip img { max-height: none; border-radius: 18px 18px 0 0; }
      .visual-strip figcaption { min-height: 165px; border-top: 0; border-left: 1.5px solid var(--ink); border-radius: 0 0 18px 18px; }
      .pool-heading { align-items: start; flex-direction: column; }
      .search { width: 100%; }
      .food-grid { grid-template-columns: repeat(2,1fr); }
    }
    @media (max-width: 520px) {
      .topbar { height: 68px; }
      .brand { font-size: 17px; }
      .brand-mark { width: 33px; height: 33px; }
      .menu-toggle, .install-button { padding: 8px 11px; font-size: 10px; }
      .stage { padding-left: 15px; padding-right: 21px; }
      .draw-panel { padding: 15px; border-radius: 21px; }
      .result { grid-template-columns: 1fr; min-height: 275px; gap: 10px; text-align: center; }
      .food-emoji { width: 80px; height: 80px; justify-self: center; font-size: 46px; }
      .meta { justify-content: center; }
      .filter-row, .filter-row.compact { grid-template-columns: 1fr; gap: 8px; }
      .filter-title { padding-top: 0; }
      .pool-count { display: none; }
      .food-pool { padding: 60px 17px; }
      .food-grid { grid-template-columns: 1fr; }
      .food-item { min-height: 68px; }
      footer { flex-direction: column; justify-content: center; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🍴</span><span>吃点啥</span></div>
    <div class="date"><small>今日菜单</small><strong id="today"></strong></div>
    <div class="top-actions">
      <span class="offline-badge"><b>●</b> 完全离线</span>
      <button class="install-button" id="installButton" type="button" hidden>安装到手机</button>
      <button class="menu-toggle" id="menuToggle" type="button">菜单库 · 80</button>
    </div>
  </header>

  <main>
    <section class="stage" id="top" aria-labelledby="pageTitle">
      <div class="intro">
        <span class="eyebrow">✦ 选择困难急救站</span>
        <h1 id="pageTitle">今天，<br><em>吃点啥？</em></h1>
        <p>别再把时间耗在菜单上。选好范围，交给一点点运气。</p>
        <div class="count-note"><b>80</b><span><strong>种平价选择</strong><br>数据和功能都保存在本机</span></div>
      </div>

      <section class="draw-panel" aria-label="随机抽取食物">
        <div class="ticket-label"><span>YOUR PICK / 今日签</span><span id="foodNumber">NO. 08</span></div>
        <div class="result reveal" id="result" aria-live="polite">
          <span class="food-emoji" id="foodEmoji" aria-hidden="true">🍜</span>
          <div>
            <p class="result-kicker">命运觉得你该吃</p>
            <h2 id="foodName">厦门沙茶面</h2>
            <div class="meta" id="foodMeta"></div>
          </div>
        </div>

        <div class="filters">
          <div class="filter-row">
            <span class="filter-title">想吃哪类</span>
            <div class="chips" id="categoryChips"></div>
          </div>
          <div class="filter-row compact">
            <span class="filter-title">人均预算</span>
            <div class="chips" id="budgetChips"></div>
            <span class="pool-count" id="poolCount"></span>
          </div>
        </div>
        <button class="draw-button" id="drawButton" type="button">🎲　就决定是它！</button>
        <p class="hint">点击按钮或按空格键，让今天的饭有着落</p>
      </section>

      <aside class="history-card">
        <h3>◷　刚刚抽到</h3>
        <div id="history"></div>
        <small>BON APPÉTIT!</small>
      </aside>
    </section>

    <figure class="visual-strip">
      <img src="./og.png" width="1664" height="936" loading="lazy" alt="面条、汉堡、披萨、饺子、三明治和米饭组成的今日菜单海报">
      <figcaption><span>随便吃，也要认真吃</span><strong>80 种平价美味，只推荐类型，不推荐店铺。</strong></figcaption>
    </figure>

    <section class="food-pool" id="foodPool" aria-labelledby="poolTitle">
      <div class="pool-heading">
        <div><small>02 / 离线菜单库</small><h2 id="poolTitle">八十种，慢慢挑</h2></div>
        <label class="search">⌕<input id="searchInput" type="search" placeholder="搜一道想吃的…" aria-label="搜索食物"></label>
      </div>
      <div class="food-grid" id="foodGrid"></div>
    </section>
  </main>

  <footer><span>吃点啥 · 安卓网页版</span><span>可安装 · 可离线 · 不推荐具体店铺</span></footer>

  <script>
    const makeFoods = (category, emoji, entries) => entries.map(([name, price, spicy]) => ({ name, category, price, emoji, spicy: Boolean(spicy) }));
    const foods = [
      ...makeFoods('面条江湖', '🍜', [
        ['兰州牛肉面',20],['日式豚骨拉面',32],['重庆小面',16,true],['老北京炸酱面',22],['武汉热干面',12],['葱油拌面',15],['陕西油泼面',18,true],['厦门沙茶面',25],['海鲜炒面',25],['新疆过油肉拌面',28]
      ]),
      ...makeFoods('米饭当家', '🍚', [
        ['黄焖鸡米饭',22],['隆江猪脚饭',25],['台式卤肉饭',20],['广式煲仔饭',28],['海南鸡饭',25],['叉烧滑蛋饭',26],['麻婆豆腐盖饭',16,true],['咖喱鸡肉饭',22],['扬州炒饭',18],['韩式石锅拌饭',28,true]
      ]),
      ...makeFoods('粉汤饺子', '🥟', [
        ['柳州螺蛳粉',18,true],['桂林卤粉',16],['云南过桥米线',24],['重庆酸辣粉',14,true],['越南牛肉河粉',28],['干炒牛河',25],['扁食汤',15],['鲜肉馄饨',16],['东北水饺',20],['鲜肉锅贴',18]
      ]),
      ...makeFoods('西式快餐', '🍔', [
        ['经典牛肉汉堡',25],['香辣鸡腿堡',20,true],['玛格丽特披萨',28],['培根芝士披萨',32],['金枪鱼三明治',18],['芝士火腿三明治',16],['美式热狗',18],['墨西哥鸡肉卷',22,true],['意式肉酱面',28],['奶油培根意面',30]
      ]),
      ...makeFoods('街头小吃', '🥙', [
        ['西安肉夹馍',15],['山东杂粮煎饼',10],['天津煎饼果子',12],['台湾手抓饼',12],['鸡蛋灌饼',10],['上海生煎包',15],['南翔小笼包',18],['广式肠粉',15],['福州肉燕',18],['东北烤冷面',12,true]
      ]),
      ...makeFoods('一锅热乎', '🍲', [
        ['麻辣烫',25,true],['川味冒菜',28,true],['便利店关东煮',18],['乐山钵钵鸡',25,true],['砂锅米线',20],['番茄肥牛锅',30],['韩式部队锅',32,true],['日式寿喜锅',35],['酸菜鱼小锅',30,true],['潮汕砂锅粥',28]
      ]),
      ...makeFoods('轻食简餐', '🥗', [
        ['凯撒鸡肉沙拉',25],['藜麦鸡胸饭',28],['全麦鸡肉卷',20],['紫菜包饭',18],['什锦寿司',28],['鸡蛋蔬菜三明治',15],['皮蛋瘦肉粥',15],['番茄鸡蛋面',16],['蒸蛋肉末套餐',22],['烤蔬菜鹰嘴豆碗',26]
      ]),
      ...makeFoods('异国风味', '🌮', [
        ['日式亲子丼',26],['日式牛肉盖饭',28],['韩式炸酱面',24],['泰式炒河粉',28,true],['冬阴功汤粉',30,true],['越南鸡肉法棍',22],['印度咖喱烤饼',30,true],['新加坡叻沙',32,true],['土耳其烤肉卷',25],['墨西哥玉米饼',28,true]
      ])
    ];

    const categories = ['全部', ...new Set(foods.map(food => food.category))];
    const budgets = [20, 30, 0];
    let selectedCategory = '全部';
    let selectedBudget = 30;
    let current = foods.find(food => food.name === '厦门沙茶面');
    let recent = loadHistory();
    let rolling = false;

    const resultEl = document.getElementById('result');
    const foodNameEl = document.getElementById('foodName');
    const foodEmojiEl = document.getElementById('foodEmoji');
    const foodMetaEl = document.getElementById('foodMeta');
    const foodNumberEl = document.getElementById('foodNumber');
    const categoryChipsEl = document.getElementById('categoryChips');
    const budgetChipsEl = document.getElementById('budgetChips');
    const poolCountEl = document.getElementById('poolCount');
    const drawButton = document.getElementById('drawButton');
    const historyEl = document.getElementById('history');
    const menuToggle = document.getElementById('menuToggle');
    const foodPool = document.getElementById('foodPool');
    const foodGrid = document.getElementById('foodGrid');
    const searchInput = document.getElementById('searchInput');
    const installButton = document.getElementById('installButton');
    let deferredInstallPrompt = null;

    function loadHistory() {
      try {
        const names = JSON.parse(localStorage.getItem('chi-dian-sha-history') || '[]');
        return names.map(name => foods.find(food => food.name === name)).filter(Boolean).slice(0, 3);
      } catch (_) { return []; }
    }

    function saveHistory() {
      try { localStorage.setItem('chi-dian-sha-history', JSON.stringify(recent.map(food => food.name))); } catch (_) {}
    }

    function getPool() {
      return foods.filter(food =>
        (selectedCategory === '全部' || food.category === selectedCategory) &&
        (selectedBudget === 0 || food.price <= selectedBudget)
      );
    }

    function updateResult(food, remember = false) {
      current = food;
      foodNameEl.textContent = food.name;
      foodEmojiEl.textContent = food.emoji;
      foodNumberEl.textContent = `NO. ${String(foods.indexOf(food) + 1).padStart(2, '0')}`;
      foodMetaEl.innerHTML = `<span>${food.category}</span><span>约 ¥${food.price}</span>${food.spicy ? '<span class="spicy">辣</span>' : ''}`;
      if (remember) {
        recent = [food, ...recent.filter(item => item.name !== food.name)].slice(0, 3);
        saveHistory();
        renderHistory();
      }
    }

    function renderHistory() {
      if (!recent.length) {
        historyEl.innerHTML = '<p class="empty">第一顿饭，<br>正等你来抽。</p>';
        return;
      }
      historyEl.innerHTML = `<ol>${recent.map((food, index) => `<li><span>${String(index + 1).padStart(2, '0')}</span><strong>${food.name}</strong></li>`).join('')}</ol>`;
    }

    function renderFilters() {
      categoryChipsEl.innerHTML = categories.map(category => `<button type="button" class="chip${category === selectedCategory ? ' active' : ''}" data-category="${category}" aria-pressed="${category === selectedCategory}">${category}</button>`).join('');
      budgetChipsEl.innerHTML = budgets.map(budget => `<button type="button" class="chip${budget === selectedBudget ? ' active' : ''}" data-budget="${budget}" aria-pressed="${budget === selectedBudget}">${budget === 0 ? '不限' : `¥${budget} 内`}</button>`).join('');
      poolCountEl.textContent = `当前可抽 ${getPool().length} 种`;
    }

    function draw() {
      const pool = getPool();
      if (rolling || !pool.length) return;
      rolling = true;
      drawButton.disabled = true;
      drawButton.textContent = '🎲　正在翻菜单…';
      resultEl.className = 'result rolling';
      let turns = 0;
      const ticker = setInterval(() => {
        updateResult(pool[Math.floor(Math.random() * pool.length)]);
        turns += 1;
        if (turns >= 11) {
          clearInterval(ticker);
          const choices = pool.length > 1 ? pool.filter(food => food.name !== current.name) : pool;
          const winner = choices[Math.floor(Math.random() * choices.length)];
          updateResult(winner, true);
          resultEl.className = 'result reveal';
          drawButton.disabled = false;
          drawButton.textContent = '🎲　就决定是它！';
          rolling = false;
        }
      }, 70);
    }

    function renderFoodGrid() {
      const keyword = searchInput.value.trim().toLowerCase();
      const visible = keyword ? foods.filter(food => `${food.name}${food.category}`.toLowerCase().includes(keyword)) : foods;
      foodGrid.innerHTML = visible.length ? visible.map((food, index) => `
        <button type="button" class="food-item" data-food="${food.name}">
          <span class="num">${String(index + 1).padStart(2, '0')}</span>
          <span class="emoji">${food.emoji}</span>
          <span class="name">${food.name}</span>
          <span class="price">¥${food.price}</span>
        </button>`).join('') : '<p class="no-results">没有找到这道美味，换个关键词试试。</p>';
    }

    categoryChipsEl.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      selectedCategory = button.dataset.category;
      renderFilters();
    });

    budgetChipsEl.addEventListener('click', event => {
      const button = event.target.closest('[data-budget]');
      if (!button) return;
      selectedBudget = Number(button.dataset.budget);
      renderFilters();
    });

    foodGrid.addEventListener('click', event => {
      const button = event.target.closest('[data-food]');
      if (!button) return;
      const food = foods.find(item => item.name === button.dataset.food);
      if (food) {
        updateResult(food, true);
        resultEl.className = 'result reveal';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    menuToggle.addEventListener('click', () => {
      const open = foodPool.classList.toggle('open');
      menuToggle.textContent = open ? '收起菜单 ↑' : '菜单库 · 80';
      if (open) setTimeout(() => foodPool.scrollIntoView({ behavior: 'smooth', block: 'start' }), 20);
    });

    searchInput.addEventListener('input', renderFoodGrid);
    drawButton.addEventListener('click', draw);
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
    });
    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'BUTTON') {
        event.preventDefault();
        draw();
      }
    });

    document.getElementById('today').textContent = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' }).format(new Date());
    updateResult(current);
    renderFilters();
    renderHistory();
    renderFoodGrid();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
