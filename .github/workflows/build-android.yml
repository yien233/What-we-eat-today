name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'versions/android-apk/**'
      - 'scripts/check-android.mjs'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'versions/android-apk/**'
      - 'scripts/check-android.mjs'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check offline menu behavior
        run: node scripts/check-android.mjs
      # These components are included in GitHub's Ubuntu 24.04 runner image.
      - name: Check required Android SDK components
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Build and lint
        working-directory: versions/android-apk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease lintRelease
      - name: Upload test builds (not the signed distribution)
        uses: actions/upload-artifact@v4
        with:
          name: android-test-builds
          path: |
            versions/android-apk/app/build/outputs/apk/debug/*.apk
            versions/android-apk/app/build/outputs/apk/release/*unsigned.apk
            versions/android-apk/app/build/reports/lint-results-release.html
          if-no-files-found: error
